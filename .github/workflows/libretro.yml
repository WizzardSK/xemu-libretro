name: Build libretro core

# The core, built with -Dlibretro=true: xemu_libretro.dll for Windows,
# cross-compiled in the MXE toolchain image upstream xemu uses for its Windows
# releases, and xemu_libretro.so for Linux x86_64 and aarch64.

on:
  workflow_dispatch:
  push:
    branches: [libretro, linux-port]

jobs:
  windows-x86_64:
    name: Windows x86_64
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xemu-project/xemu-win64-toolchain-gcc:sha-18018f1
    defaults:
      run:
        shell: bash
    env:
      CROSSPREFIX: x86_64-w64-mingw32.static-
      CROSSAR: x86_64-w64-mingw32.static-gcc-ar
    steps:
      # No submodules: they are QEMU's firmware sources (edk2, u-boot and the
      # like), none of which xemu builds; its dependencies come as meson wraps.
      # The history is for the version string (git describe), without blobs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false

      - name: Mark the checkout safe for git
        run: git config --global --add safe.directory '*'

      # The libretro build links glslang and SPIRV-Tools statically
      # (cc.find_library(..., static: true) in meson.build), and the MXE image
      # has neither, so they are built here into its prefix, where the cross
      # compiler finds them.
      - name: Cache glslang
        id: glslang-cache
        uses: actions/cache@v4
        with:
          path: /opt/glslang
          key: glslang-15.4.0-mxe-gcc-sha-18018f1

      - name: Build glslang and SPIRV-Tools
        if: steps.glslang-cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --depth 1 -b 15.4.0 https://github.com/KhronosGroup/glslang.git /tmp/glslang
          cd /tmp/glslang
          python3 update_glslang_sources.py
          ${CROSSPREFIX}cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/glslang \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_OPT=ON \
            -DENABLE_GLSLANG_BINARIES=OFF \
            -DGLSLANG_TESTS=OFF \
            -DBUILD_TESTING=OFF \
            -DSPIRV_SKIP_TESTS=ON \
            -DSPIRV_SKIP_EXECUTABLES=ON \
            -DSPIRV_TOOLS_BUILD_STATIC=ON
          cmake --build build -j"$(nproc)"
          cmake --install build
          # SPIRV-Tools installs its static library as SPIRV-Tools-static when
          # it builds both kinds; the build looks for SPIRV-Tools.
          cd /opt/glslang/lib
          [ -f libSPIRV-Tools.a ] || cp libSPIRV-Tools-static.a libSPIRV-Tools.a
          ls -la

      # meson's find_library(static: true) only searches the compiler's own
      # library directories, and a cross gcc takes neither -L nor LIBRARY_PATH
      # for that, so the libraries go into the toolchain's own lib directory.
      - name: Put glslang where the cross compiler looks
        run: |
          libdir=$(dirname "$(${CROSSPREFIX}gcc -print-file-name=libkernel32.a)")
          echo "toolchain lib dir: $libdir"
          cp -a /opt/glslang/lib/*.a "$libdir/"

      - name: Configure
        run: |
          ./configure \
            --extra-cflags="-DXBOX=1 -Wno-error -I/opt/glslang/include" \
            --extra-ldflags="-L/opt/glslang/lib" \
            --target-list=i386-softmmu \
            --cross-prefix=$CROSSPREFIX --static \
            -Dlibretro=true
        env:
          AR: ${{ env.CROSSAR }}

      - name: Build
        run: ninja -C build xemu_libretro.dll 2>&1 | tail -200

      - name: Collect
        run: |
          mkdir -p dist
          cp build/xemu_libretro.dll dist/
          ${CROSSPREFIX}strip --strip-unneeded dist/xemu_libretro.dll
          ls -la dist
          # What it needs at load time: Windows' own DLLs and nothing else.
          ${CROSSPREFIX}objdump -p dist/xemu_libretro.dll | grep 'DLL Name' | sort -u

      - uses: actions/upload-artifact@v4
        with:
          name: xemu_libretro-windows-x86_64
          path: dist/xemu_libretro.dll

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-24.04${{ matrix.arch == 'aarch64' && '-arm' || '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false

      # upstream's build dependencies (debian/control; pipewire for the SDL3
      # subproject, which wants its headers), with libcurl on
      # OpenSSL rather than GnuTLS - the soname frontends' runtimes carry -
      # and glslang/SPIRV-Tools as the static libraries the libretro build
      # links
      - name: Install dependencies
        run: |
          sudo apt-get -qy update
          sudo apt-get -qy install ninja-build python3-pip python3-tomli python3-yaml python3-venv \
            libepoxy-dev libpixman-1-dev libsdl2-dev libsamplerate0-dev zlib1g-dev libssl-dev \
            libpcap-dev libslirp-dev libvulkan-dev libusb-1.0-0-dev libcurl4-openssl-dev \
            libglib2.0-dev libx11-dev libegl-dev libgl-dev glslang-dev spirv-tools patchelf \
            libpipewire-0.3-dev

      - name: Configure
        run: |
          ./configure \
            --extra-cflags="-DXBOX=1 -Wno-error" \
            --target-list=i386-softmmu \
            -Dlibretro=true -Dpipewire=disabled
        env:
          LIBRARY_PATH: /usr/lib/${{ matrix.arch }}-linux-gnu

      - name: Build
        run: ninja -C build xemu_libretro.so 2>&1 | tail -200

      # libslirp and libpcap are not in every frontend's runtime (Flatpak
      # RetroArch's, for one), so they go next to the core, found through
      # $ORIGIN.
      - name: Collect
        run: |
          mkdir -p dist
          cp build/xemu_libretro.so dist/
          strip --strip-unneeded dist/xemu_libretro.so
          patchelf --set-rpath '$ORIGIN' dist/xemu_libretro.so
          for lib in libslirp.so.0 libpcap.so.0.8; do
            cp -L "/usr/lib/${{ matrix.arch }}-linux-gnu/$lib" dist/
          done
          ls -la dist
          readelf -d dist/xemu_libretro.so | grep -E 'NEEDED|RUNPATH'

      - uses: actions/upload-artifact@v4
        with:
          name: xemu_libretro-linux-${{ matrix.arch }}
          path: dist/
