name: Build libretro core

# The core, built with -Dlibretro=true: xemu_libretro.dll for Windows,
# cross-compiled in the MXE toolchain image upstream xemu uses for its Windows
# releases, and xemu_libretro.so for Linux x86_64 and aarch64.

on:
  workflow_dispatch:
  push:
    branches: [libretro]

jobs:
  windows-x86_64:
    name: Windows x86_64
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xemu-project/xemu-win64-toolchain-gcc:sha-18018f1
    defaults:
      run:
        shell: bash
    env:
      CROSSPREFIX: x86_64-w64-mingw32.static-
      CROSSAR: x86_64-w64-mingw32.static-gcc-ar
    steps:
      # No submodules: they are QEMU's firmware sources (edk2, u-boot and the
      # like), none of which xemu builds; its dependencies come as meson wraps.
      # The history is for the version string (git describe), without blobs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false

      - name: Mark the checkout safe for git
        run: git config --global --add safe.directory '*'

      # The libretro build links glslang and SPIRV-Tools statically
      # (cc.find_library(..., static: true) in meson.build), and the MXE image
      # has neither, so they are built here into its prefix, where the cross
      # compiler finds them.
      - name: Cache glslang
        id: glslang-cache
        uses: actions/cache@v4
        with:
          path: /opt/glslang
          key: glslang-15.4.0-mxe-gcc-sha-18018f1

      - name: Build glslang and SPIRV-Tools
        if: steps.glslang-cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --depth 1 -b 15.4.0 https://github.com/KhronosGroup/glslang.git /tmp/glslang
          cd /tmp/glslang
          python3 update_glslang_sources.py
          ${CROSSPREFIX}cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/glslang \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_OPT=ON \
            -DENABLE_GLSLANG_BINARIES=OFF \
            -DGLSLANG_TESTS=OFF \
            -DBUILD_TESTING=OFF \
            -DSPIRV_SKIP_TESTS=ON \
            -DSPIRV_SKIP_EXECUTABLES=ON \
            -DSPIRV_TOOLS_BUILD_STATIC=ON
          cmake --build build -j"$(nproc)"
          cmake --install build
          # SPIRV-Tools installs its static library as SPIRV-Tools-static when
          # it builds both kinds; the build looks for SPIRV-Tools.
          cd /opt/glslang/lib
          [ -f libSPIRV-Tools.a ] || cp libSPIRV-Tools-static.a libSPIRV-Tools.a
          ls -la

      # meson's find_library(static: true) only searches the compiler's own
      # library directories, and a cross gcc takes neither -L nor LIBRARY_PATH
      # for that, so the libraries go into the toolchain's own lib directory.
      - name: Put glslang where the cross compiler looks
        run: |
          libdir=$(dirname "$(${CROSSPREFIX}gcc -print-file-name=libkernel32.a)")
          echo "toolchain lib dir: $libdir"
          cp -a /opt/glslang/lib/*.a "$libdir/"

      # The DSP JIT's prebuilt library, which meson fetches with curl; the
      # MXE image has no curl, so it is put where meson looks for it first
      - name: Fetch the dsp56300 library
        run: |
          ver=$(sed -n "s/^project('dsp56300', version: '\(.*\)')/\1/p" subprojects/dsp56300/meson.build)
          a=dsp56300-$ver-x86_64-pc-windows-gnu.tar.gz
          python3 -c "import sys, urllib.request; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])" \
            https://github.com/mborgerson/dsp56300/releases/download/v$ver/$a subprojects/dsp56300/$a
          ls -la subprojects/dsp56300/

      - name: Configure
        run: |
          ./configure \
            --extra-cflags="-DXBOX=1 -Wno-error -I/opt/glslang/include" \
            --extra-ldflags="-L/opt/glslang/lib" \
            --target-list=i386-softmmu \
            --cross-prefix=$CROSSPREFIX --static \
            -Dlibretro=true
        env:
          AR: ${{ env.CROSSAR }}

      - name: Build
        run: ninja -C build xemu_libretro.dll 2>&1 | tail -200

      - name: Collect
        run: |
          mkdir -p dist
          cp build/xemu_libretro.dll dist/
          cp ui/xemu_libretro.info dist/
          ${CROSSPREFIX}strip --strip-unneeded dist/xemu_libretro.dll
          ls -la dist
          # What it needs at load time: Windows' own DLLs and nothing else.
          ${CROSSPREFIX}objdump -p dist/xemu_libretro.dll | grep 'DLL Name' | sort -u

      - uses: actions/upload-artifact@v4
        with:
          name: xemu_libretro-windows-x86_64
          path: dist/xemu_libretro.dll

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-24.04${{ matrix.arch == 'aarch64' && '-arm' || '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false

      # upstream's build dependencies (debian/control; pipewire for the SDL3
      # subproject, which wants its headers), with libcurl on
      # OpenSSL rather than GnuTLS - the soname frontends' runtimes carry -
      # and glslang/SPIRV-Tools as the static libraries the libretro build
      # links
      - name: Install dependencies
        run: |
          sudo apt-get -qy update
          sudo apt-get -qy install ninja-build python3-pip python3-tomli python3-yaml python3-venv \
            libepoxy-dev libpixman-1-dev libsdl2-dev libsamplerate0-dev zlib1g-dev libssl-dev \
            libpcap-dev libslirp-dev libvulkan-dev libusb-1.0-0-dev libcurl4-openssl-dev \
            libglib2.0-dev libx11-dev libegl-dev libgl-dev glslang-dev spirv-tools patchelf \
            libpipewire-0.3-dev

      # The core is a shared library, so QEMU's static libraries that go into
      # it have to be position independent (b_staticpic).
      - name: Configure
        run: |
          ./configure \
            --extra-cflags="-DXBOX=1 -Wno-error" \
            --target-list=i386-softmmu \
            -Dlibretro=true -Dpipewire=disabled \
            -Db_staticpic=true
        env:
          LIBRARY_PATH: /usr/lib/${{ matrix.arch }}-linux-gnu

      - name: Build
        run: ninja -C build xemu_libretro.so 2>&1 | tail -200

      # libslirp is not in every frontend's runtime (Flatpak
      # RetroArch's, for one), so it goes next to the core, found through
      # $ORIGIN.
      - name: Collect
        run: |
          mkdir -p dist
          cp build/xemu_libretro.so dist/
          cp ui/xemu_libretro.info dist/
          strip --strip-unneeded dist/xemu_libretro.so
          patchelf --set-rpath '$ORIGIN' dist/xemu_libretro.so
          for lib in libslirp.so.0; do
            cp -L "/usr/lib/${{ matrix.arch }}-linux-gnu/$lib" dist/
          done
          ls -la dist
          readelf -d dist/xemu_libretro.so | grep -E 'NEEDED|RUNPATH'

      - uses: actions/upload-artifact@v4
        with:
          name: xemu_libretro-linux-${{ matrix.arch }}
          path: dist/

  # After X-OG Mobile's recipe (Ashnar2602/X-OG_Mobile): glib, pixman and
  # libsamplerate from vcpkg's Android triplets, the NDK's clang, and QEMU's
  # configure with what Android has no use for left out. The renderer is
  # Vulkan, through the frontend's context.
  android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triplet: arm64-android
            cpu: aarch64
            clang: aarch64-linux-android29
          - abi: x86_64
            triplet: x64-android
            cpu: x86_64
            clang: x86_64-linux-android29
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false

      - name: Install dependencies
        run: |
          sudo apt-get -qy update
          sudo apt-get -qy install ninja-build python3-pip python3-tomli python3-yaml python3-venv \
            glslang-dev glslang-tools spirv-tools pkg-config
          echo "NDK=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-android-${{ matrix.triplet }}-v1

      - name: vcpkg
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install --triplet=${{ matrix.triplet }} \
            glib pixman libsamplerate libepoxy
          echo "PREFIX=$VCPKG_INSTALLATION_ROOT/installed/${{ matrix.triplet }}" >> $GITHUB_ENV

      - name: Configure
        run: |
          T=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          export PKG_CONFIG_LIBDIR=$PREFIX/lib/pkgconfig PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig
          export AR=$T/llvm-ar RANLIB=$T/llvm-ranlib NM=$T/llvm-nm STRIP=$T/llvm-strip
          ./configure \
            --cross-prefix= \
            --cc=$T/${{ matrix.clang }}-clang --cxx=$T/${{ matrix.clang }}-clang++ \
            --host-cc=cc --cpu=${{ matrix.cpu }} \
            --target-list=i386-softmmu \
            --disable-werror --disable-rust --disable-docs --disable-tools --disable-guest-agent \
            --disable-gtk --disable-sdl --disable-sdl-image --disable-vnc --disable-spice --disable-curses \
            --disable-virglrenderer --disable-libusb --disable-usb-redir --disable-curl \
            --disable-gnutls --disable-nettle --disable-gcrypt --disable-bzip2 --disable-zstd --disable-lzo \
            --disable-libnfs --disable-libiscsi --disable-linux-aio --disable-linux-io-uring \
            --disable-slirp --disable-pa --disable-pipewire --disable-alsa --disable-jack --disable-oss \
            --disable-sndio --audio-drv-list= \
            --extra-cflags="-DXBOX=1 -Wno-error" \
            --extra-ldflags="-L$PREFIX/lib" \
            -Dlibretro=true -Db_staticpic=true

      # Every error of the run, which a tail of the output cuts off
      - name: Build
        run: |
          ninja -k 0 -C build xemu_libretro.so > ninja.log 2>&1 && exit 0
          grep -E -B2 -A8 "error:|FAILED:" ninja.log | head -600
          exit 1

      - name: Collect
        run: |
          mkdir -p dist
          cp build/xemu_libretro.so dist/xemu_libretro_android.so
          cp ui/xemu_libretro.info dist/
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-unneeded dist/xemu_libretro_android.so
          ls -la dist
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -d dist/xemu_libretro_android.so | grep NEEDED

      - uses: actions/upload-artifact@v4
        with:
          name: xemu_libretro-android-${{ matrix.abi }}
          path: dist/

  # As upstream's macOS build (build.sh): the libraries from MacPorts through
  # scripts/download-macos-libs.py, Apple clang with the SDK and the minimum
  # versions upstream targets
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          brew install ninja coreutils vulkan-headers
          pip install pyyaml requests tomli
          python3 ./scripts/download-macos-libs.py ${{ matrix.arch }}

      - name: Configure
        run: |
          arch=${{ matrix.arch }}
          if [ "$arch" = arm64 ]; then min=13.7.4; else min=12.7.5; fi
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          lib=$PWD/macos-libs/$arch/opt/local
          export CFLAGS="-arch $arch -target $arch-apple-macos$min -isysroot $sdk -I$lib/include -mmacosx-version-min=$min"
          export LDFLAGS="-arch $arch -isysroot $sdk"
          export PKG_CONFIG_LIBDIR="$lib/lib/pkgconfig"
          ./configure \
            --extra-cflags="-DXBOX=1 -Wno-error $CFLAGS" \
            --extra-ldflags="-headerpad_max_install_names" \
            --target-list=i386-softmmu --disable-cocoa --cross-prefix= \
            -Dlibretro=true -Db_staticpic=true

      - name: Build
        run: |
          ninja -k 0 -C build xemu_libretro.dylib > ninja.log 2>&1 && exit 0
          grep -E -B2 -A8 "error:|FAILED:" ninja.log | head -600
          exit 1

      - name: Collect
        run: |
          mkdir -p dist
          cp build/xemu_libretro.dylib dist/xemu_libretro.dylib
          cp ui/xemu_libretro.info dist/
          strip -x dist/xemu_libretro.dylib
          # The MacPorts libraries (glib, pixman, epoxy, ...) go along in a
          # folder of their own next to the core, as upstream bundles them
          # into its app. Their install names are under /opt/local/lib, where
          # nothing is on the runner: they are taken from macos-libs and
          # pointed at that folder, and so are their own dependencies.
          src=$PWD/macos-libs/${{ matrix.arch }}/opt/local/lib
          libs=dist/xemu_libretro_libs
          mkdir -p $libs
          todo=dist/xemu_libretro.dylib
          while [ -n "$todo" ]; do
            next=""
            for f in $todo; do
              for dep in $(otool -L "$f" | awk 'NR>1 && $1 ~ /^\/opt\/local\// {print $1}'); do
                name=$(basename "$dep")
                if [ ! -f "$libs/$name" ]; then
                  cp -L "$src/$name" "$libs/$name"
                  chmod u+w "$libs/$name"
                  install_name_tool -id "@loader_path/$name" "$libs/$name"
                  next="$next $libs/$name"
                fi
                if [ "$f" = dist/xemu_libretro.dylib ]; then
                  install_name_tool -change "$dep" "@loader_path/xemu_libretro_libs/$name" "$f"
                else
                  install_name_tool -change "$dep" "@loader_path/$name" "$f"
                fi
              done
            done
            todo=$next
          done
          ls $libs
          codesign -f -s - $libs/*.dylib dist/xemu_libretro.dylib
          otool -L dist/xemu_libretro.dylib
          lipo -info dist/xemu_libretro.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: xemu_libretro-macos-${{ matrix.arch }}
          path: dist/
